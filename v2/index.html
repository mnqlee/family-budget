<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#102019">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" crossorigin="anonymous"></script>
<style>
:root{
  /* Lights off. Text and accents are on-dark; surfaces are glass over a green gradient. */
  --ink:#F3F1E8; --ink2:#DCE5DF; --mut:#9FB6A8; --faint:rgba(243,241,232,.52);
  --line:rgba(255,255,255,.15); --hair:rgba(255,255,255,.10);
  --green:#7FC49A;            /* on-dark green: text, fills, accents */
  --greenS:#2C5C49;           /* green as a button surface, white text on it */
  --dgreen:#3E7760; --dgreen2:#102019; --sage:#8FB7A0;
  --brass:#C9A961; --brasst:#D4B978; --gold:#C9A961;
  --red:#E2A294; --redf:#D9705C;
  --paper:#16302A; --panel:#1C332B;        /* opaque surfaces, for anything that must hide what is behind it */
  --card:rgba(255,255,255,.07); --gline:rgba(255,255,255,.13);
  --okbg:rgba(127,196,154,.16); --warnbg:rgba(201,169,97,.18);
  --badbg:rgba(217,112,92,.18); --mutbg:rgba(255,255,255,.08);
  --paidbg:rgba(127,196,154,.11);
  --actg:#2C5C49; --actb:#8A6A1C; --acte:#44584E; --actr:#A8412F;
  --shadow:0 1px 0 rgba(255,255,255,.08) inset,0 14px 30px -20px rgba(0,0,0,.8);
  --glass:saturate(135%) blur(16px);
  --cream:#F3F1E8; --onsage:#9FB6A8; --ongold:#D4B978; --onred:#E2A294; --champ:#E6D5A8;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
/* No overflow or padding on html/body: either one makes position:fixed scroll with
   the page on iOS, which is what made the bottom bar drift upward. */
html{-webkit-text-size-adjust:100%;background:#102019}
body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh;
  background:
    radial-gradient(130% 62% at 86% -4%,rgba(201,169,97,.22) 0%,rgba(201,169,97,0) 56%),
    linear-gradient(168deg,#23493B 0%,#16302A 42%,#102019 100%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--ink)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
input::placeholder,textarea::placeholder{color:rgba(243,241,232,.42)}
input[type=date]{color-scheme:dark}
select{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:34px}
p{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.serif{font-family:'Roboto Slab',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;overflow-x:clip;min-height:100dvh}
.hdr{background:transparent;border-bottom:1px solid var(--hair);color:var(--cream);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
.hdr .t{font-family:'Roboto Slab',Georgia,serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
.hdr .s{font-size:12px;color:var(--mut)}
.hdr .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--mut);margin-bottom:10px}
.body{padding:12px 12px 110px}
/* glass only on top-level containers, where there is a gradient worth blurring */
.card{background:var(--card);border:1px solid var(--gline);border-radius:16px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.tile,.pill,.cta{box-shadow:var(--shadow)}
.cta:active,.pill:active,.tile:active{transform:translateY(1px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.tile,.incs,.deep{background:var(--panel)}
}
.sec{font-size:11px;letter-spacing:.1em;color:var(--mut);margin:16px 0 7px 4px;text-transform:uppercase}
.hsec{display:flex;align-items:baseline;gap:9px;margin:11px 2px 7px;
  font-family:'Roboto Slab',Georgia,serif;font-weight:500;font-size:13.5px;letter-spacing:-.01em;color:var(--ink)}
.hsec b{font-family:Inter,sans-serif;font-weight:400;font-size:11px;color:var(--mut)}
.hsec::after{content:"";flex:1;height:1px;border-radius:1px;
  background:linear-gradient(90deg,var(--gold),rgba(184,146,46,0))}
.incs{display:flex;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  border:1px solid rgba(201,169,97,.3);background:rgba(201,169,97,.05);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.incs button{flex:1;min-width:0;border:0;border-radius:0;background:transparent;
  padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.incs button+button{border-left:1px solid rgba(201,169,97,.26)}
.incs button.on,.incs button:active{background:rgba(201,169,97,.14)}
.incs .l{font-size:11px;color:var(--mut);white-space:nowrap}
.incs .v{font-size:15px;font-weight:500;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13px}
.kv:first-child{border-top:0}
.muted{color:var(--mut);font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--brasst)}
/* ---- Home: paper header, deep hero card, spine tiles ---- */
.phd{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.phd .gre{font-family:'Roboto Slab',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:-.015em;
  color:var(--ink);margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phd .code{font-size:11.5px;color:var(--mut);white-space:nowrap;flex:0 0 auto}
.phd .when{font-size:12px;color:var(--mut);margin:2px 0 0}
.whoc{margin-top:11px;border-color:rgba(201,169,97,.45)}
.deep .hmain{display:flex;align-items:flex-end;gap:12px}
.deep .ring{flex:0 0 auto;text-align:center}
.deep .ring small{display:block;font-size:9.5px;color:var(--onsage);margin-top:1px}
.deep{display:block;width:100%;text-align:left;border:0;margin-top:11px;border-radius:20px;
  padding:14px 16px 13px;color:var(--cream);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 34px -22px rgba(0,0,0,.8)}
.deep .lbl{display:block;font-size:12px;color:var(--onsage)}
.deep .big{display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:35px;font-weight:500;letter-spacing:-.04em;line-height:1.05;margin-top:2px}
.deep .state{display:block;font-size:11.5px;margin-top:4px}
.deep .flag{flex:0 0 auto;font-size:11px;border-radius:20px;padding:4px 11px;border:1px solid;white-space:nowrap}
.deep .track{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:15px}
.deep .track i{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--ongold);
  transition:width .45s cubic-bezier(.22,1,.36,1);box-shadow:0 0 12px rgba(212,185,120,.65)}
.deep .track u{position:absolute;top:-4px;width:2px;height:13px;background:var(--cream);border-radius:1px}
.deep .hfoot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--onsage);margin-top:10px}
.deep .hsep{height:1px;background:rgba(255,255,255,.12);margin:13px 0 4px}
.deep .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.deep .hrow.dim{color:var(--onsage)}
.deep .hempty{font-size:12.5px;color:var(--onsage);text-align:center;padding:12px 0}
.deep .hbtn{width:100%;margin-top:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:var(--cream);border-radius:12px;padding:10px;font-size:13px}
.deep .dmv{width:24px;height:24px;padding:0;border-radius:7px;font-size:12px;line-height:1;flex:0 0 auto;
  background:rgba(255,255,255,.12);border:0;color:var(--cream)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;text-align:left;padding:0;overflow:hidden;border-radius:15px;
  background:var(--card);border:1px solid var(--gline);box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.tile.sel{border-color:var(--dgreen)}
.tile .sp{position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(255,255,255,.12)}
.tile .sp i{position:absolute;left:0;bottom:0;width:3px;display:block;
  transition:height .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 9px currentColor}
.tile .pad{display:block;padding:9px 11px 12px 15px}
.tile .lbl{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.tile .val{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:19px;font-weight:500;letter-spacing:-.03em;line-height:1}
.tile .sub{display:block;font-size:10px;color:var(--faint);margin-top:4px}
.seg{display:flex;background:rgba(0,0,0,.26);border-radius:11px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;padding:8px;font-size:13px;border-radius:9px;background:transparent;color:var(--mut)}
.seg button.on{background:var(--brass);color:#16261F;font-weight:500}
.chip{height:auto;padding:5px 11px;border:0;border-radius:20px;font-size:12px}
.pill{border-radius:20px;padding:7px 12px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.pill.on{background:var(--greenS);color:var(--cream);border-color:#3E7760}
.cta{width:100%;padding:13px;border:0;border-radius:14px;background:var(--brass);color:#16261F;font-size:15px;font-weight:500}
.ghost{background:transparent;border:1px dashed var(--brass);color:var(--brasst)}
.danger{color:var(--red);border-color:rgba(226,162,148,.4)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.g2>div{min-width:0}
.g2 input,.g2 select{width:100%;min-width:0}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);background:#16302A}
.sw:last-child{border-bottom:0}
/* the action panels stay hidden until the row is actually engaged, so a promoted
   layer can never leave a coloured seam along the row divider */
.lp,.rp{position:absolute;top:0;bottom:0;display:flex;visibility:hidden}
.sw.act .lp,.sw.act .rp{visibility:visible}
.lp{left:0}.rp{right:0}
.lp button,.rp button{height:100%;border:0;border-radius:0;color:#fff;font-size:10.5px;letter-spacing:.01em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.lp button:active,.rp button:active{filter:brightness(.9)}
/* must be opaque: it slides over the action buttons */
.fg{position:relative;background:var(--panel);touch-action:pan-y;-webkit-user-select:none;user-select:none;
  transition:transform .34s cubic-bezier(.22,1,.36,1)}
.sw.act .fg{will-change:transform}
.fg.dr{transition:none}
.erow{display:block;width:100%;text-align:left;border:0;border-radius:0;background:var(--panel);padding:0;
  border-left:3px solid transparent}
.erow.paid{border-left-color:var(--gold);
  background:linear-gradient(90deg,rgba(201,169,97,.26) 0%,rgba(201,169,97,.12) 45%,rgba(201,169,97,.02) 100%)}
.erow.paid .nm{color:var(--champ)}
.erow.paid .mtr{background:rgba(201,169,97,.2)}
.erow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 14px 9px}
.erow .nm{font-size:15px;margin:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.erow .s2{font-size:11.5px;color:var(--mut);margin:3px 0 0;display:block}
.erow .amt{font-family:'IBM Plex Mono',monospace;font-size:17px;white-space:nowrap;text-align:right;display:block;line-height:1.15}
.erow .amt small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.erow .mtr{display:block;position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.11);
  overflow:hidden;margin:0 14px 12px}
.erow .mtr+.roll{margin-top:-4px}
.erow.paid .mtr{background:rgba(127,196,154,.2)}
.erow .mtr i{display:block;height:100%;border-radius:4px;transition:width .4s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 8px currentColor}
.roll{display:flex;align-items:center;gap:7px;margin:0;padding:0 14px 10px;color:#8FC2E8;font-size:11.5px}
.roll i{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:17px;height:17px;border-radius:5px;background:rgba(143,194,232,.18);color:#8FC2E8;font-style:normal;font-size:11px}
.roll b{font-weight:500;font-family:'IBM Plex Mono',monospace}
.tag{font-size:10.5px;letter-spacing:.03em;background:var(--gold);color:#16261F;border-radius:7px;
  padding:2px 8px;white-space:nowrap;font-weight:500}
.tag.over{background:var(--badbg);color:var(--red)}
#ribw{position:relative;margin:0 -12px}
#ribw::after{content:"";position:absolute;right:0;top:0;bottom:9px;width:26px;pointer-events:none;
  background:linear-gradient(90deg,rgba(233,236,230,0),var(--paper))}
#rib{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:2px 12px 9px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
#rib::-webkit-scrollbar{display:none}
#rib .cell{scroll-snap-align:center}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;padding:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;outline-offset:1px}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin:14px 2px 0}
.leg span{display:flex;align-items:center;gap:8px;font-size:12px}
.sqr{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;flex:0 0 auto}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{padding:12px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:17px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 10px}
.txr:active{background:rgba(255,255,255,.06)}
.dmv{width:24px;height:24px;padding:0;border-radius:7px;font-size:12px;line-height:1;
  background:rgba(255,255,255,.1);border:0;color:var(--cream);flex:0 0 auto}
.sortr{display:flex;width:100%;text-align:left;align-items:center;gap:11px;margin-bottom:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.sortr.on{border-color:var(--green)}
.sortr .sck{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--cream)}
.sortr.on .sck{background:var(--greenS);border-color:var(--green);color:var(--cream)}
.ubr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px;margin-bottom:8px}
.ubr.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.ubt{display:flex;align-items:center;gap:10px}
.ubck{flex:0 0 auto;width:26px;height:26px;padding:0;border-radius:8px;border:1.5px solid var(--line);
  background:transparent;color:var(--cream);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.ubr.on .ubck{background:var(--greenS);border-color:var(--green);color:var(--cream)}
.prib{flex:0 0 auto;width:auto;padding:4px 9px;font-size:11px;border-radius:20px;background:rgba(255,255,255,.1);border:0;color:var(--ink2)}
.ubb{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair)}
.ubb .muted{flex:1}
.uba{width:96px;flex:0 0 96px;text-align:right;padding:7px 9px;font-size:14px}
.ubmax{flex:0 0 auto;width:auto;padding:7px 11px;font-size:12px;border-radius:10px}
.txr{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px;
  border:0;border-radius:0;border-top:1px solid var(--hair);background:transparent;padding:11px 14px;font-size:13px}
.txr:first-child{border-top:0}

.txr .nm{display:block;font-size:14px}
.txr .s2{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
#undo{position:fixed;left:50%;transform:translateX(-50%);width:min(496px,calc(100% - 24px));border:1px solid rgba(255,255,255,.12);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;
  background:#0C1A15;color:#F3F1E8;border-radius:12px;padding:11px 13px;font-size:13px;z-index:60}
#undo button{border:0;background:transparent;color:#C9A961;font-weight:500;font-size:13px;padding:4px 8px}
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,28,23,.82);display:flex;z-index:50;
  -webkit-backdrop-filter:saturate(140%) blur(20px);backdrop-filter:saturate(140%) blur(20px);
  border-top:1px solid rgba(255,255,255,.09);
  padding:10px 6px calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;
  box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -10px 24px -16px rgba(0,0,0,.5)}
#nav button{flex:1;border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10px}
#nav button.on{color:#C9A961}
#nav .fab{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;
  background:var(--brass);color:#16261F;margin-top:-26px;border:4px solid #142521;font-size:30px;line-height:1;
  box-shadow:0 0 22px rgba(201,169,97,.4)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FC49A;margin-right:6px}
.dot.off{background:#C9846F}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="undo" role="status"></div>
<nav id="nav" aria-label="Main"></nav>
<script>
"use strict";
/* ========== state ========== */
var CFGK='hb6_cfg',CACHEK='hb6_cache';
var cfg={};try{cfg=JSON.parse(localStorage.getItem(CFGK)||'{}')}catch(e){cfg={}}
function blank(){return{settings:{income1:0,income15:0,freq:'semi',tpl1:null,tpl15:null,
  tr:{date:'2029-09',cushion:6,income:0,goalIds:[]},posOnly:true},
  env:{},budgets:{},tx:{},members:{},notes:{},kids:{},vault:{},debts:{},accts:{},more:null,seq:1}}
var data=blank();
try{var c=localStorage.getItem(CACHEK);if(c)data=Object.assign(blank(),JSON.parse(c))}catch(e){}
if(!data.settings)data.settings=blank().settings;
if(!data.settings.tr)data.settings.tr={date:'2029-09',cushion:6,income:0,goalIds:[]};
if(!data.settings.tr.goalIds)data.settings.tr.goalIds=[];
function defaultMore(){return [
 {g:'Money',items:[{id:'m1',n:'Reports',ic:'📊'},{id:'m2',n:'Yearly expenses',ic:'🚗'},
   {id:'m3',n:'Goals',ic:'🎯'},{id:'m4',n:'Debts',ic:'💳'},{id:'m5',n:'Accounts',ic:'🏦'}]},
 {g:'Planning',items:[{id:'m6',n:'Transition runway',ic:'🏁'}]},
 {g:'Family',items:[{id:'m7',n:'Kids and allowance',ic:'🧒'},{id:'m8',n:'Readiness vault',ic:'🛡️'}]},
 {g:'App',items:[{id:'m9',n:'Settings',ic:'⚙️'},{id:'m10',n:'Export backup',ic:'⬇️'}]}]}

var ubP=null,ubPick={},ubBack=null;
function openUseBuf(p,back){
  ubP=p==null?curP():p;ubBack=back||null;ubPick={};
  // pre-fill down your priority order until the buffer runs out, nothing silent about it
  var left=bufBal(ubP);
  overList(ubP).concat(shortList(ubP)).forEach(function(e){
    if(priOf(e)===4||left<=0)return;
    var take=Math.min(gapOf(e,ubP),left);
    if(take>0){ubPick[e.id]=take;left-=take}});
  sub='usebuf';render()}
function ubTotal(){var s=0;for(var k in ubPick)s+=ubPick[k]||0;return s}
function screenUseBuf(){

    (over.length||short.length?'<button id="ubgo" class="cta" style="margin-top:14px">Move the money</button>':'')+

function repBody(){

    months.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('en-US',{month:'short'})})}

  for(var k in data.tx){var t=data.tx[k],ym=ymOf(t.date);
    if(t.kind==='inc')inc[ym]=(inc[ym]||0)+t.amt;
    if(t.kind==='exp')exp[ym]=(exp[ym]||0)+t.amt}
  months.forEach(function(mn){ // paychecks count as income even when not logged as tx
    var y=+mn.k.slice(0,4),mo=+mn.k.slice(5)-1,a=y*24+mo*2;
    inc[mn.k]=(inc[mn.k]||0)+dep(a)+dep(a+1)});
  var mx=1;months.forEach(function(mn){mx=Math.max(mx,inc[mn.k]||0,exp[mn.k]||0)});
  var bars=months.map(function(mn){
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'+
     '<div style="display:flex;gap:3px;align-items:flex-end;height:120px">'+
      '<span style="width:10px;height:'+((inc[mn.k]||0)/mx*100)+'%;background:var(--green);border-radius:2px 2px 0 0"></span>'+
      '<span style="width:10px;height:'+((exp[mn.k]||0)/mx*100)+'%;background:var(--redf);border-radius:2px 2px 0 0"></span></div>'+
     '<span style="font-size:10px;color:var(--mut)">'+mn.l+'</span></div>'}).join('');
  var last=months[months.length-1];
  var spendBy=envs().map(function(e){var s=0;for(var k2 in data.tx){var t2=data.tx[k2];
      if(t2.kind==='exp'&&t2.env===e.id)s+=t2.amt}return{e:e,v:s}})
    .filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v}).slice(0,8);
  var mxs=spendBy.length?spendBy[0].v:1;
  var billSpend=0,freeSpend=0;
  for(var k3 in data.tx){var t3=data.tx[k3];if(t3.kind!=='exp')continue;
    var e3=data.env[t3.env];if(e3&&e3.dueDay)billSpend+=t3.amt;else freeSpend+=t3.amt}

   '<div style="display:flex;gap:4px;align-items:flex-end">'+bars+'</div>'+
   '<p class="muted" style="margin-top:10px">This month: <b class="pos">'+m0(inc[last.k]||0)+' in</b> \u00B7 <b class="neg">'+m0(exp[last.k]||0)+' out</b></p>','padding:14px')+

    meter(x.v/mxs*100,'var(--dgreen)')+'</div>'}).join(''):'<p class="empty">Nothing logged yet.</p>','padding:6px 14px')+
  '<p class="hsec">Bills vs everyday</p>'+
  card(kv('Bills and fixed',m(billSpend)+' \u00B7 '+Math.round(billSpend/both*100)+'%')+meter(billSpend/both*100,'var(--dgreen)')+
   kv('Everyday',m(freeSpend)+' \u00B7 '+Math.round(freeSpend/both*100)+'%')+meter(freeSpend/both*100,'var(--brass)'),'padding:6px 14px 14px')}

function goalBody(which){

  var tot=0,tgt=0,per=0;

  var ps=monthPeriods(0);
  function tplSum(which){var t=which==='1st'?data.settings.tpl1:data.settings.tpl15;
    if(!t||!Object.keys(t).length)return which+': nothing recorded yet, targets come from each envelope\u2019s monthly total.';
    var n=0,s=0;for(var k in t){if(data.env[k]){n++;s+=t[k]}}
    return which+': '+n+' envelopes, '+m(s)+' per pay period.'}
  var mem='';for(var k in data.members)mem+='<div class="kv"><span>'+esc(data.members[k].name)+(k===cfg.member?' \u00B7 this phone':'')+'</span>'+
    '<span style="display:flex;gap:8px"><button data-mu="'+k+'" style="padding:4px 9px;width:auto">Use</button>'+
    '<button data-md="'+k+'" style="padding:4px 9px;width:auto" class="danger">\u00D7</button></span></div>';
  return card('<p class="sec" style="margin:0 0 6px">Household</p>'+
    '<div class="kv"><span>Code</span><span class="mono">'+esc(cfg.code||'not set')+'</span></div>'+
    '<div class="kv"><span>Sync</span><span class="mono">'+(rootRef?(online?'Firebase live':'Firebase, offline'):'this device only')+'</span></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><input id="hc" placeholder="Household code" value="'+esc(cfg.code||'')+'">'+
    '<button id="hj" style="width:auto;background:var(--dgreen);color:#F3F1E8;border:0">Join</button></div>'+
    '<p class="muted" style="margin-top:6px">Everyone who types the same code shares the same budget.</p>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Members</p>'+(mem||'<p class="muted">No members yet.</p>')+
    '<div style="display:flex;gap:8px;margin-top:10px"><input id="mn" placeholder="Add member name">'+
    '<button id="ma" style="width:auto">Add</button></div>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Paychecks</p>'+
    '<div class="kv"><span>Deposit on the 1st</span><input id="d1" class="mono" value="'+((data.settings.income1||0)/100).toFixed(2)+'" style="width:120px;text-align:right;padding:6px 8px"></div>'+
    '<div class="kv"><span>Deposit on the 15th</span><input id="d15" class="mono" value="'+((data.settings.income15||0)/100).toFixed(2)+'" style="width:120px;text-align:right;padding:6px 8px"></div>'+
    kv('Monthly total',m((data.settings.income1||0)+(data.settings.income15||0)))+
    '<p class="muted" style="margin-top:6px">Pay cycle is the 1st and the 15th.</p>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Recorded envelope amounts</p>'+
    '<p class="muted" style="margin-bottom:10px">Set every envelope to the amount you want for a pay period, then record it. From then on those are your targets and \u26A1 Fill drops those exact amounts in. Nothing is calculated for you.</p>'+
    '<button id="rec1" style="width:100%;margin-bottom:8px">\u{1F4CC} Record these envelope amounts for the 1st</button>'+
    '<button id="rec15" style="width:100%">\u{1F4CC} Record these envelope amounts for the 15th</button>'+
    '<p class="muted" style="margin-top:10px;line-height:1.6">'+tplSum('1st')+'<br>'+tplSum('15th')+'</p>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button id="clr1" style="flex:1">Clear the 1st record</button>'+
    '<button id="clr15" style="flex:1">Clear the 15th record</button></div>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Start over</p>'+
    '<p class="muted" style="margin-bottom:10px">Wipes the money back to zero so you can fill the envelopes again. Assignments, transactions and PAID marks all go.</p>'+
    '<div style="display:flex;gap:8px"><button id="cp" style="flex:1">Clear this pay period</button>'+
    '<button id="ca" style="flex:1" class="danger">Clear the money</button></div>'+
    '<button id="cb" style="width:100%;margin-top:8px" class="danger">\u{1F9E8} Delete every envelope and start from a blank list</button>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Display</p>'+
    '<div class="kv"><span style="flex:1">In envelopes counts positive balances only</span>'+
    '<button id="po" class="chip" style="background:'+(data.settings.posOnly!==false?'var(--okbg)':'var(--mutbg)')+';color:'+(data.settings.posOnly!==false?'var(--green)':'var(--mut)')+'">'+
    (data.settings.posOnly!==false?'On':'Off')+'</button></div>','padding:13px 14px')}
function wireSet(){
  $('#hj').onclick=function(){var c=$('#hc').value.trim();if(!c)return toast('Type a code');
    cfg.code=c;if(!cfg.member){var id='u'+uid();data.members[id]={name:'Me'};cfg.member=id}
    saveCfg();cache();connect();toast('Joined household '+c);render()};
  $('#ma').onclick=function(){var n=$('#mn').value.trim();if(!n)return toast('Type a name');
    var id='u'+uid();put('members/'+id,{name:n});if(!cfg.member){cfg.member=id;saveCfg()}
    bar('Added '+esc(n),function(){delete data.members[id]})};
  document.querySelectorAll('[data-mu]').forEach(function(b){b.onclick=function(){
    cfg.member=b.dataset.mu;saveCfg();render();toast('This phone is now '+data.members[cfg.member].name)}});
  document.querySelectorAll('[data-md]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.md,prev=data.members[id];if(!confirm('Remove '+prev.name+'?'))return;
    put('members/'+id,null);bar('Removed '+esc(prev.name),function(){data.members[id]=prev})}});
  $('#d1').onchange=function(){put('settings/income1',toC(this.value))};
  $('#d15').onchange=function(){put('settings/income15',toC(this.value))};
  $('#po').onclick=function(){put('settings/posOnly',data.settings.posOnly===false)};
  function rec(which){
    var ps=monthPeriods(0),p=which==='1st'?ps[0]:ps[1],t={},n=0;
    envs().forEach(function(e){var v=alloc(e.id,p);if(v>0){t[e.id]=v;n++}});
    if(!n)return toast('Nothing assigned in that pay period yet. Fund your envelopes first.');
    var prev=which==='1st'?data.settings.tpl1:data.settings.tpl15;
    put('settings/'+(which==='1st'?'tpl1':'tpl15'),t);
    bar('Recorded '+n+' envelopes for the '+which,function(){setPath(data,'settings/'+(which==='1st'?'tpl1':'tpl15'),prev)})}
  $('#rec1').onclick=function(){rec('1st')};
  $('#rec15').onclick=function(){rec('15th')};
  $('#clr1').onclick=function(){var prev=data.settings.tpl1;put('settings/tpl1',null);
    bar('Cleared the 1st record',function(){setPath(data,'settings/tpl1',prev)})};
  $('#clr15').onclick=function(){var prev=data.settings.tpl15;put('settings/tpl15',null);
    bar('Cleared the 15th record',function(){setPath(data,'settings/tpl15',prev)})};
  $('#cp').onclick=function(){clearMoney('period')};
  $('#ca').onclick=function(){clearMoney('all')};
  $('#cb').onclick=function(){startBlank()}}
function clearMoney(scope){
  var p=curP(),mk=paidKey(p);
  var txAll=Object.keys(data.tx),txHere=txAll.filter(function(k){return pidOf(data.tx[k].date)===p});
  var paidAll=envs().filter(function(e){return e.paid&&Object.keys(e.paid).length});
  var paidHere=envs().filter(function(e){return e.paid&&e.paid[mk]});
  var nB=scope==='all'?Object.keys(data.budgets).length:Object.keys(data.budgets[p]||{}).length;
  var nT=scope==='all'?txAll.length:txHere.length;
  var nP=scope==='all'?paidAll.length:paidHere.length;
  if(!nB&&!nT&&!nP)return toast(scope==='all'?'Already empty':'Nothing logged in '+pName(p));
  if(!confirm('Wipe the envelopes back to zero?\n\nScope: '+(scope==='all'?'EVERY pay period':pName(p)+' only')+
    '\n\nRemoves '+nB+' assignments, '+nT+' transactions and '+nP+' PAID marks.\n\nKeeps your envelopes, members, recorded amounts, debts, accounts, kids and vault.\n\nThis cannot be undone.'))return;
  if(scope==='all'){setPath(data,'budgets',{});setPath(data,'tx',{});
    paidAll.forEach(function(e){data.env[e.id].paid=null})}
  else{setPath(data,'budgets/'+p,null);
    txHere.forEach(function(k){delete data.tx[k]});
    paidHere.forEach(function(e){delete data.env[e.id].paid[mk]})}
  cache();if(rootRef)rootRef.set(data);render();
  toast(scope==='all'?'Everything cleared. Fill the envelopes again from Budget.':'Cleared '+pName(p))}
function startBlank(){
  var n=envs().length;
  if(!confirm('Start completely from scratch?\n\nDeletes ALL '+n+' envelopes plus every assignment, transaction, PAID mark and recorded amount.\n\nKeeps members, debts, accounts, kids and the vault.\n\nThis cannot be undone.'))return;
  if(!confirm('Last check. Delete all '+n+' envelopes?'))return;
  setPath(data,'env',{});setPath(data,'budgets',{});setPath(data,'tx',{});
  setPath(data,'settings/tpl1',null);setPath(data,'settings/tpl15',null);
  cache();if(rootRef)rootRef.set(data);render();
  toast('Blank slate. Add your first envelope from Budget.')}
/* export */
function expBody(){
  return card('<p class="serif" style="font-size:16px;margin-bottom:6px">Backup</p>'+
   '<p class="muted" style="margin-bottom:12px">Everything: envelopes, transactions, recorded amounts, goals, kids, vault and settings. Do this before anything that rewrites stored data.</p>'+
   '<button id="ex" class="cta">Export JSON backup</button>'+
   '<p class="sec" style="margin-top:16px">Restore</p>'+
   '<textarea id="imp" rows="4" placeholder="Paste a backup here"></textarea>'+
   '<button id="im" style="width:100%;margin-top:8px" class="danger">Replace everything with this backup</button>','padding:16px')}
function wireExp(){
  $('#ex').onclick=function(){
    var s=JSON.stringify(data,null,2);
    try{var b=new Blob([s],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='home-base-'+today()+'.json';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);toast('Backup downloaded')}
    catch(e){prompt('Copy this and keep it somewhere safe',s)}};
  $('#im').onclick=function(){
    var v=$('#imp').value.trim();if(!v)return toast('Paste a backup first');
    var parsed;try{parsed=JSON.parse(v)}catch(e){return toast('That is not valid JSON')}
    if(!parsed.env)return toast('That backup has no envelopes in it');
    if(!confirm('Replace everything with this backup?'))return;
    data=Object.assign(blank(),parsed);cache();if(rootRef)rootRef.set(data);render();toast('Backup restored')}}
/* ========== nav / render ========== */
var tab='home',sub=null;
var TABS=[['home','\u{1F3E0}','Home'],['budget','\u2709\uFE0F','Budget'],['add','+',''],['cal','\u{1F4C5}','Calendar'],['more','\u2630','More']];
function go(t){tab=t;sub=null;if(t!=='more')moreOpen=null;kidEdit=null;vEdit=null;window.scrollTo(0,0);render()}
function paintNav(){
  var n=$('#nav');n.innerHTML='';
  TABS.forEach(function(t){
    var b=el('button',tab===t[0]?'on':'');
    b.innerHTML=t[0]==='add'?'<span class="fab">+</span>':'<span style="font-size:19px">'+t[1]+'</span><span>'+t[2]+'</span>';
    b.setAttribute('aria-label',t[2]||'Add expense');
    b.onclick=function(){t[0]==='add'?goAdd(null):go(t[0])};
    n.appendChild(b)})}
function render(){
  paintNav();
  // Home opens on paper, every other screen keeps its green header
  if(sub==='sort')return screenSort();
  if(sub==='usebuf')return screenUseBuf();
  if(sub==='txform')return screenTxForm();
  if(sub==='fund')return screenFund();
  if(sub==='envform')return screenEnvForm();
  if(tab==='home')screenHome();
  else if(tab==='budget')screenBudget();
  else if(tab==='add')screenAdd();
  else if(tab==='cal')screenCal();
  else screenMore()}
function boot(){
  if(sweepLoose())cache();          // also fixes the local copy, before anything is drawn
  if(cfg.code)connect();
  if(!cfg.member){var ids=Object.keys(data.members);if(ids.length)cfg.member=ids[0];saveCfg()}
  render();
  if(!cfg.code)setTimeout(function(){toast('More \u2192 Settings to set your household code and deposits')},600)}
window.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
boot();
</script>
