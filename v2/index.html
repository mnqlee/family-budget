<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E4033">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#18261F; --ink2:#41504A; --mut:#7C877F; --line:#D3DAD2; --hair:#EFF0EB;
  --green:#2C5C49; --dgreen:#1E4033; --dgreen2:#16302A; --sage:#5E8B75;
  --brass:#A8862B; --brasst:#8A6A1C; --gold:#B8922E;
  --red:#9C3A2A; --redf:#B3402F;
  --paper:#E9ECE6; --card:#FFFFFF; --gline:#E3D6AE;
  --okbg:#E4EFE7; --warnbg:#F4EDDA; --badbg:#F6E4DF; --mutbg:#EBEDE7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
p{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.serif{font-family:'Roboto Slab',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto}
.hdr{background:var(--dgreen);color:#F3F1E8;padding:16px 16px 16px}
.hdr .t{font-family:'Roboto Slab',Georgia,serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
.hdr .s{font-size:12px;color:#A9BDB2}
.hdr .eyebrow{font-size:11px;letter-spacing:.14em;color:#A9BDB2;margin-bottom:10px}
.body{padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--gline);border-radius:16px}
.sec{font-size:11px;letter-spacing:.1em;color:var(--mut);margin:16px 0 7px 4px;text-transform:uppercase}
.hsec{display:flex;align-items:center;gap:10px;margin:16px 2px 9px;
  font-family:'Roboto Slab',Georgia,serif;font-weight:500;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.hsec::after{content:"";flex:1;height:1px;border-radius:1px;
  background:linear-gradient(90deg,var(--gold),rgba(184,146,46,0))}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13px}
.kv:first-child{border-top:0}
.muted{color:var(--mut);font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--brasst)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;padding:0;overflow:hidden;border-radius:16px;background:var(--card);border:1px solid var(--gline)}
.tile.sel{border-color:var(--dgreen)}
.tile .pad{display:block;padding:13px 13px 11px}
.tile .chip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;margin-bottom:9px;font-size:15px}
.tile .lbl{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.tile .val{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500;line-height:1}
.tile .sub{display:block;font-size:10px;color:var(--mut);margin-top:5px}
.tile .met{display:block;height:4px;background:var(--hair)}
.tile .met i{display:block;height:100%;transition:width .45s}
.seg{display:flex;background:var(--dgreen2);border-radius:11px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;padding:8px;font-size:13px;border-radius:9px;background:transparent;color:#A9BDB2}
.seg button.on{background:var(--brass);color:#fff;font-weight:500}
.chip{height:auto;padding:5px 11px;border:0;border-radius:20px;font-size:12px}
.pill{border-radius:20px;padding:7px 12px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.pill.on{background:var(--dgreen);color:#F3F1E8;border-color:var(--dgreen)}
.cta{width:100%;padding:13px;border:0;border-radius:14px;background:var(--brass);color:#fff;font-size:15px;font-weight:500}
.ghost{background:transparent;border:1px dashed var(--brass);color:var(--brasst)}
.danger{color:var(--red);border-color:#E8D2CC}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.g2>div{min-width:0}
.g2 input,.g2 select{width:100%;min-width:0}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--hair)}
.sw:last-child{border-bottom:0}
.lp,.rp{position:absolute;top:0;bottom:0;display:flex}
.lp{left:0}.rp{right:0}
.lp button,.rp button{height:100%;border:0;border-radius:0;color:#fff;font-size:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:0}
.fg{position:relative;background:var(--card);touch-action:pan-y;-webkit-user-select:none;user-select:none;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.fg.dr{transition:none}
.erow{display:block;width:100%;text-align:left;border:0;border-radius:0;background:var(--card);padding:0}
.erow .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px 12px}
.erow .nm{font-size:15px;margin:0}
.erow .s2{font-size:11px;color:var(--mut);margin:3px 0 0}
.erow .amt{font-family:'IBM Plex Mono',monospace;font-size:16px;white-space:nowrap}
.erow .mtr{display:block;position:relative;height:3px;background:var(--hair);overflow:hidden}
.erow .mtr i{display:block;height:3px;transition:width .35s}
.erow .mtr .tick{position:absolute;top:-3px;width:2px;height:9px;background:var(--ink);border-radius:1px}
.tag{font-size:11px;background:var(--okbg);color:var(--green);border-radius:6px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;padding:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;outline-offset:1px}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin:14px 2px 0}
.leg span{display:flex;align-items:center;gap:8px;font-size:12px}
.sqr{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;flex:0 0 auto}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{padding:12px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:17px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 10px}
#undo{position:fixed;left:50%;transform:translateX(-50%);width:min(496px,calc(100% - 24px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;
  background:var(--ink);color:#F3F1E8;border-radius:12px;padding:11px 13px;font-size:13px;z-index:60}
#undo button{border:0;background:transparent;color:#C9A961;font-weight:500;font-size:13px;padding:4px 8px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--dgreen);display:flex;z-index:50;
  padding:10px 6px calc(12px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#A9BDB2;font-size:10px}
#nav button.on{color:#C9A961}
#nav .fab{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;
  background:var(--brass);color:#fff;margin-top:-26px;border:4px solid var(--paper);font-size:30px;line-height:1}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FC49A;margin-right:6px}
.dot.off{background:#C9846F}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="undo" role="status"></div>
<nav id="nav" aria-label="Main"></nav>
<script>
"use strict";
/* ========== state ========== */
var CFGK='hb6_cfg',CACHEK='hb6_cache';
var cfg={};try{cfg=JSON.parse(localStorage.getItem(CFGK)||'{}')}catch(e){cfg={}}
function blank(){return{settings:{income1:0,income15:0,freq:'semi',tpl1:null,tpl15:null,
  tr:{date:'2029-09',cushion:6,income:0,goalIds:[]},posOnly:true},
  env:{},budgets:{},tx:{},members:{},notes:{},kids:{},vault:{},debts:{},accts:{},more:null,seq:1}}
var data=blank();
try{var c=localStorage.getItem(CACHEK);if(c)data=Object.assign(blank(),JSON.parse(c))}catch(e){}
if(!data.settings)data.settings=blank().settings;
if(!data.settings.tr)data.settings.tr={date:'2029-09',cushion:6,income:0,goalIds:[]};
if(!data.settings.tr.goalIds)data.settings.tr.goalIds=[];
function defaultMore(){return [
 {g:'Money',items:[{id:'m1',n:'Reports',ic:'📊'},{id:'m2',n:'Yearly expenses',ic:'🚗'},
   {id:'m3',n:'Goals',ic:'🎯'},{id:'m4',n:'Debts',ic:'💳'},{id:'m5',n:'Accounts',ic:'🏦'}]},
 {g:'Planning',items:[{id:'m6',n:'Transition runway',ic:'🏁'}]},
 {g:'Family',items:[{id:'m7',n:'Kids and allowance',ic:'🧒'},{id:'m8',n:'Readiness vault',ic:'🛡️'}]},
 {g:'App',items:[{id:'m9',n:'Settings',ic:'⚙️'},{id:'m10',n:'Export backup',ic:'⬇️'}]}]}
if(!data.more||!data.more.length)data.more=defaultMore();
var rootRef=null,online=false;
function cache(){try{localStorage.setItem(CACHEK,JSON.stringify(data))}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFGK,JSON.stringify(cfg))}catch(e){}}
function uid(){return (data.seq=(data.seq||1)+1)+'-'+Math.random().toString(36).slice(2,7)}
function setPath(o,path,v){var a=path.split('/'),k;while(a.length>1){k=a.shift();if(typeof o[k]!=='object'||o[k]===null)o[k]={};o=o[k]}
  if(v===null)delete o[a[0]];else o[a[0]]=v}
function put(path,v){setPath(data,path,v);cache();render();
  if(rootRef){(v===null?rootRef.child(path).remove():rootRef.child(path).set(v)).catch(function(){toast('Offline, it will sync later')})}}
function connect(){
  if(!cfg.code||typeof firebase==='undefined')return;
  try{
    if(!firebase.apps.length)firebase.initializeApp({databaseURL:cfg.dbUrl||'https://family-budget-1f7f3-default-rtdb.firebaseio.com'});
    rootRef=firebase.database().ref('hb6/'+cfg.code);
    rootRef.on('value',function(snap){
      var v=snap.val();
      if(v){data=Object.assign(blank(),v);
        if(!data.settings)data.settings=blank().settings;
        if(!data.settings.tr)data.settings.tr={date:'2029-09',cushion:6,income:0,goalIds:[]};
        if(!data.settings.tr.goalIds)data.settings.tr.goalIds=[];
        if(!data.more)data.more=blank().more;
        migrate();cache()}
      else{rootRef.set(data)}
      online=true;render()});
    firebase.database().ref('.info/connected').on('value',function(s){online=!!s.val();var d=document.getElementById('syncDot');if(d)d.className='dot'+(online?'':' off')});
  }catch(e){}
}
function migrate(){ // runs against CLOUD data, not the local cache
  var n=0;for(var k in data.env){var e=data.env[k];if(e&&e.roll!==true){e.roll=true;n++}}
  if(n&&rootRef)rootRef.child('env').set(data.env).catch(function(){});
}
/* ========== helpers ========== */
function $(s,r){return (r||document).querySelector(s)}
function el(t,c,h){var x=document.createElement(t);if(c)x.className=c;if(h!=null)x.innerHTML=h;return x}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function m(c){c=c||0;var n=c/100;return (n<0?'\u2212':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function m0(c){c=c||0;var n=c/100;return (n<0?'\u2212':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US')}
function toC(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:Math.round(n*100)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymOf(ds){return ds.slice(0,7)}
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* ========== periods ========== */
function pidOfDate(d){return d.getFullYear()*24+d.getMonth()*2+(d.getDate()>=15?1:0)}
function pidOf(ds){return pidOfDate(new Date(ds+'T00:00:00'))}
function curP(){return pidOfDate(new Date())}
function pStart(p){var y=Math.floor(p/24),r=p-y*24;return new Date(y,Math.floor(r/2),r%2?15:1)}
function pEnd(p){var s=pStart(p);return p%2?new Date(s.getFullYear(),s.getMonth()+1,0):new Date(s.getFullYear(),s.getMonth(),14)}
function pName(p){var s=pStart(p);return s.toLocaleDateString('en-US',{month:'short'})+' '+s.getDate()+' pay period'}
function pShort(p){var s=pStart(p);return s.toLocaleDateString('en-US',{month:'short'})+' '+s.getDate()}
function minPid(){var lo=null;for(var k in data.budgets){var p=+k;if(lo===null||p<lo)lo=p}
  for(var t in data.tx){var q=pidOf(data.tx[t].date);if(lo===null||q<lo)lo=q}
  return lo===null?curP():lo}
function dep(p){return p%2===0?(data.settings.income1||0):(data.settings.income15||0)}
function monthPeriods(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+(off||0));
  var a=d.getFullYear()*24+d.getMonth()*2;return[a,a+1]}
/* ========== money ========== */
function envs(){var a=[];for(var k in data.env){var e=data.env[k];e.id=k;a.push(e)}
  return a.sort(function(x,y){return (x.ord||0)-(y.ord||0)||String(x.name).localeCompare(String(y.name))})}
function byId(id){var e=data.env[id];if(e)e.id=id;return e}
function bills(){return envs().filter(function(e){return e.kind!=='goal'&&e.dueDay})}
function everyday(){return envs().filter(function(e){return e.kind!=='goal'&&!e.dueDay})}
function sinks(){return envs().filter(function(e){return e.kind==='goal'&&e.sub==='sink'})}
function goals(){return envs().filter(function(e){return e.kind==='goal'&&e.sub!=='sink'})}
function monthly(e){return e.monthly||0}
function tplFor(p){var t=p%2===0?data.settings.tpl1:data.settings.tpl15;
  return (t&&Object.keys(t).length)?t:null}
function autoTarget(e,p){ // only used when you have not recorded an amount
  var mo=monthly(e),pp=(e.perPay!=null&&e.perPay!=='')?e.perPay:null;
  if(e.fundFrom==='1st')return p%2===0?(pp!=null?pp:mo):0;
  if(e.fundFrom==='15th')return p%2===1?(pp!=null?pp:mo):0;
  if(pp!=null)return pp;
  var half=Math.floor(mo/2);return p%2===0?half:(mo-half)}
function target(e,p){var t=tplFor(p);
  if(t&&t[e.id]!=null)return t[e.id];
  return autoTarget(e,p)}
function alloc(id,p){var b=data.budgets[p];return (b&&b[id]!=null)?b[id]:0}
function spentIn(id,p){var s=0;for(var k in data.tx){var t=data.tx[k];if(pidOf(t.date)!==p)continue;
  if(t.kind==='exp'&&t.env===id)s+=t.amt;
  if(t.kind==='mv'&&t.from===id)s+=t.amt}return s}
function addedIn(id,p){var s=0;for(var k in data.tx){var t=data.tx[k];if(pidOf(t.date)!==p)continue;
  if(t.kind==='inc'&&t.env===id)s+=t.amt;
  if(t.kind==='mv'&&t.to===id)s+=t.amt}return s}
function fundedIn(id,p){return alloc(id,p)+addedIn(id,p)}
function bal(id,p){ // every envelope rolls, so this is cumulative
  var s=0,lo=minPid();if(p==null)p=curP();
  for(var q=lo;q<=p;q++)s+=fundedIn(id,q)-spentIn(id,q);
  return s}
function rolledIn(id,p){return p<=minPid()?0:Math.max(0,bal(id,p-1))}
function totalFunded(id,p){var s=0,lo=minPid();if(p==null)p=curP();
  for(var q=lo;q<=p;q++)s+=fundedIn(id,q);return s}
function totalSpent(id,p){var s=0,lo=minPid();if(p==null)p=curP();
  for(var q=lo;q<=p;q++)s+=spentIn(id,q);return s}
function dailySpend(days){ // last N days of expenses, for the sparkline
  var out=[],now=new Date();
  for(var i=days-1;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var v=0;for(var k in data.tx){var t=data.tx[k];if(t.kind==='exp'&&t.date===ds)v+=t.amt}
    out.push(v)}
  return out}
function paidIn(e,p){return !!(e.paid&&e.paid[pStart(p).getFullYear()+'-'+String(pStart(p).getMonth()+1).padStart(2,'0')])}
function paidKey(p){var s=pStart(p);return s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')}
function leftToFund(p){var s=0;envs().forEach(function(e){if(paidIn(e,p))return;
  s+=Math.max(0,target(e,p)-alloc(e.id,p))});return s}
function targetTotal(p){var s=0;envs().forEach(function(e){s+=target(e,p)});return s}
function allocTotal(p){var s=0;envs().forEach(function(e){s+=alloc(e.id,p)});return s}
function safeToSpend(p){var s=0;everyday().forEach(function(e){s+=Math.max(0,bal(e.id,p))});return s}
function overspentList(p){return envs().filter(function(e){return !paidIn(e,p)&&bal(e.id,p)<0})
  .sort(function(a,b){return bal(a.id,p)-bal(b.id,p)})}
function overspent(p){var s=0;overspentList(p).forEach(function(e){s-=bal(e.id,p)});return s}
function inEnvelopes(p){var s=0;envs().forEach(function(e){var b=bal(e.id,p);
  s+=data.settings.posOnly===false?b:Math.max(0,b)});return s}
function dueOn(day,y,mo){var s=0;bills().forEach(function(e){if(e.dueDay===day)s+=monthly(e)});return s}
function billsOn(day){return bills().filter(function(e){return e.dueDay===day})}
/* ========== undo ========== */
var ut;
function bar(msg,fn){var u=$('#undo');
  u.innerHTML='<span style="flex:1">'+msg+'</span>'+(fn?'<button id="ub">Undo</button>':'');
  u.style.display='flex';
  if(fn)$('#ub').onclick=function(){fn();cache();if(rootRef)rootRef.set(data);u.style.display='none';clearTimeout(ut);render()};
  clearTimeout(ut);ut=setTimeout(function(){u.style.display='none'},fn?6000:2400)}
function toast(msg){bar(esc(msg),null)}
/* ========== swipe ========== */
var openRow=null;
function swipe(w,o){
  var fg=$('.fg',w),L=o.left||0,R=o.right||0,x0=0,y0=0,pos=0,cur=0,mode=null,pid=null;
  function set(v,anim){fg.classList.toggle('dr',!anim);fg.style.transform='translateX('+v+'px)'}
  var api={el:w,close:function(){pos=0;set(0,true);if(openRow===api)openRow=null},
    to:function(v){if(v&&openRow&&openRow!==api)openRow.close();pos=v;set(v,true);
      if(v)openRow=api;else if(openRow===api)openRow=null}};
  fg.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;cur=pos;mode='p';pid=e.pointerId});
  fg.addEventListener('pointermove',function(e){
    if(mode!=='p'&&mode!=='h')return;
    var dx=e.clientX-x0,dy=e.clientY-y0;
    if(mode==='p'){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      if(Math.abs(dy)>=Math.abs(dx)){mode='v';return}
      mode='h';try{fg.setPointerCapture(pid)}catch(err){}}
    var v=pos+dx;if(v<-R)v=-R+(v+R)*0.25;if(v>L)v=L+(v-L)*0.25;
    cur=v;set(v,false)});
  fg.addEventListener('pointerup',function(){
    if(mode==='h')api.to(cur<-R*0.35&&R?-R:(cur>L*0.35&&L?L:0));
    else if(mode==='p'){if(pos!==0)api.close();else if(o.tap)o.tap()}
    mode=null});
  fg.addEventListener('pointercancel',function(){if(mode==='h')api.to(pos);mode=null});
  return api}
document.addEventListener('pointerdown',function(e){
  if(openRow&&!openRow.el.contains(e.target))openRow.close()},true);

/* ========== envelope row ========== */
function paceLeft(p){var s=pStart(p),e=pEnd(p),now=new Date();
  var tot=Math.round((e-s)/864e5)+1,gone=Math.min(tot,Math.max(0,Math.round((now-s)/864e5)+1));
  return Math.round((1-gone/tot)*100)}
function envRow(e,p,p2){
  // p2 set means the Month view: both halves add together and the balance is measured at the end
  var last=p2==null?p:p2;
  var paid=!!e.dueDay&&(paidIn(e,p)||(p2!=null&&paidIn(e,p2)));
  var b=bal(e.id,last),tg=paid?monthly(e):(target(e,p)+(p2!=null?target(e,p2):0));
  var shown=paid?0:b,over=!paid&&b<0;
  var pct=paid?0:(tg?Math.max(0,Math.min(100,b/tg*100)):0);
  var col=over?'var(--redf)':(pct<25?'var(--brass)':'var(--green)');
  var sub;
  if(e.kind==='goal')sub=Math.round(e.target?b/e.target*100:0)+'% of '+m0(e.target||0)+' target';
  else if(paid)sub='paid \u2713'+(e.dueDay?' \u00B7 due the '+ord(e.dueDay):'');
  else if(over)sub='over by '+m(-b);
  else sub='funded '+m(fundedIn(e.id,p)+(p2!=null?fundedIn(e.id,p2):0))+' of '+m(tg)+(e.dueDay?' \u00B7 due the '+ord(e.dueDay):'');
  var ri=paid?0:rolledIn(e.id,p);
  return '<button class="erow" data-env="'+e.id+'" data-p="'+last+'">'+
    '<span class="top"><span><span class="nm">'+esc(e.name)+(paid?'<span class="tag">PAID</span>':'')+'</span>'+
    '<span class="s2" style="display:block;color:'+(over?'var(--red)':'var(--mut)')+'">'+sub+
    (ri>0?'<br>\u21A9 includes '+m(ri)+' rolled over':'')+'</span></span>'+
    '<span class="amt" style="color:'+(paid?'#9AA39C':over?'var(--red)':'var(--ink)')+'">'+m(shown)+
    '<span style="color:var(--mut)"> / '+m(tg)+'</span></span></span>'+
    '<span class="mtr"><i style="width:'+pct+'%;background:'+col+'"></i>'+
    (paid||e.kind==='goal'||p2!=null?'':'<span class="tick" style="left:'+paceLeft(p)+'%"></span>')+'</span></button>'}
function ord(d){var v=d%100;if(v>=11&&v<=13)return d+'th';
  switch(d%10){case 1:return d+'st';case 2:return d+'nd';case 3:return d+'rd';default:return d+'th'}}
function wrapRows(root,p){

        '<span style="font-size:18px;line-height:1">'+(paid?'\u21BA':'\u2713')+'</span><span>'+(paid?'Undo paid':'Mark paid')+'</span></button></div>':'')+
      '<div class="rp">'+(isBill?'':act('Spend','var(--green)','\u2212'))+act('Move','var(--brass)','\u21C4')+act('Edit','#5F6B63','\u270E')+'</div>'+

    var pb=$('.pb',w);

    w.querySelectorAll('.rp button').forEach(function(b){
      b.onclick=function(ev){ev.stopPropagation();api.close();
        var a=b.dataset.a;

/* ========== pay / unpay ========== */
function pay(id,p){
  var e=byId(id);if(!e)return;
  if(e.feeds&&data.env[e.feeds]){
    var amt=bal(id,p),to=data.env[e.feeds];
    if(amt<=0)return toast(e.name+' has nothing in it to hand over');
    var t1=uid();
    put('tx/'+t1,{kind:'mv',amt:amt,from:id,to:e.feeds,payee:'Into '+to.name,date:today(),who:cfg.member||'',note:'Half of the bill'});
    put('env/'+id+'/paid/'+paidKey(p),t1);
    bar(m(amt)+' moved into '+esc(to.name),function(){delete data.tx[t1];setPath(data,'env/'+id+'/paid/'+paidKey(p),null)});
    return}
  var amt2=monthly(e)>0?monthly(e):Math.max(0,bal(id,p)),t2=uid();
  if(amt2<=0){toast(e.name+' has no amount set. Give it a monthly total first.');return}
  put('tx/'+t2,{kind:'exp',amt:amt2,env:id,payee:e.name,date:today(),who:cfg.member||'',note:'Bill'});
  put('env/'+id+'/paid/'+paidKey(p),t2);
  bar(esc(e.name)+' marked paid',function(){delete data.tx[t2];setPath(data,'env/'+id+'/paid/'+paidKey(p),null)})}
function unpay(id,p){
  var e=byId(id);if(!e)return;var k=paidKey(p),txId=e.paid&&e.paid[k],old=txId?data.tx[txId]:null;
  if(txId)put('tx/'+txId,null);
  put('env/'+id+'/paid/'+k,null);
  bar(esc(e.name)+' marked unpaid',function(){if(old)data.tx[txId]=old;setPath(data,'env/'+id+'/paid/'+k,txId||true)})}

/* reports */
function repBody(){
  var months=[],now=new Date();
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('en-US',{month:'short'})})}
  var inc={},exp={};
  for(var k in data.tx){var t=data.tx[k],ym=ymOf(t.date);
    if(t.kind==='inc')inc[ym]=(inc[ym]||0)+t.amt;
    if(t.kind==='exp')exp[ym]=(exp[ym]||0)+t.amt}
  months.forEach(function(mn){ // paychecks count as income even when not logged as tx
    var y=+mn.k.slice(0,4),mo=+mn.k.slice(5)-1,a=y*24+mo*2;
    inc[mn.k]=(inc[mn.k]||0)+dep(a)+dep(a+1)});
  var mx=1;months.forEach(function(mn){mx=Math.max(mx,inc[mn.k]||0,exp[mn.k]||0)});
  var bars=months.map(function(mn){
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'+
     '<div style="display:flex;gap:3px;align-items:flex-end;height:120px">'+
      '<span style="width:10px;height:'+((inc[mn.k]||0)/mx*100)+'%;background:var(--green);border-radius:2px 2px 0 0"></span>'+
      '<span style="width:10px;height:'+((exp[mn.k]||0)/mx*100)+'%;background:var(--redf);border-radius:2px 2px 0 0"></span></div>'+
     '<span style="font-size:10px;color:var(--mut)">'+mn.l+'</span></div>'}).join('');
  var last=months[months.length-1];
  var spendBy=envs().map(function(e){var s=0;for(var k2 in data.tx){var t2=data.tx[k2];
      if(t2.kind==='exp'&&t2.env===e.id)s+=t2.amt}return{e:e,v:s}})
    .filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v}).slice(0,8);
  var mxs=spendBy.length?spendBy[0].v:1;
  var billSpend=0,freeSpend=0;
  for(var k3 in data.tx){var t3=data.tx[k3];if(t3.kind!=='exp')continue;
    var e3=data.env[t3.env];if(e3&&e3.dueDay)billSpend+=t3.amt;else freeSpend+=t3.amt}
  var both=billSpend+freeSpend||1;
  return card('<p class="serif" style="font-size:16px">Income vs spending</p>'+
   '<p class="muted" style="margin:2px 0 10px">Six months, by calendar month. Paychecks count as income.</p>'+
   '<div style="display:flex;gap:16px;margin-bottom:10px">'+
    '<span style="display:flex;align-items:center;gap:6px;font-size:12px"><i style="width:10px;height:10px;border-radius:3px;background:var(--green)"></i>Money in</span>'+
    '<span style="display:flex;align-items:center;gap:6px;font-size:12px"><i style="width:10px;height:10px;border-radius:3px;background:var(--redf)"></i>Money out</span></div>'+
   '<div style="display:flex;gap:4px;align-items:flex-end">'+bars+'</div>'+
   '<p class="muted" style="margin-top:10px">This month: <b class="pos">'+m0(inc[last.k]||0)+' in</b> \u00B7 <b class="neg">'+m0(exp[last.k]||0)+' out</b></p>','padding:14px')+
  '<p class="hsec">Where we are spending most</p>'+
  card(spendBy.length?spendBy.map(function(x){return '<div style="padding:8px 0">'+
    '<div style="display:flex;justify-content:space-between;font-size:13px"><span>'+esc(x.e.name)+'</span><span class="mono">'+m(x.v)+'</span></div>'+
    meter(x.v/mxs*100,'var(--dgreen)')+'</div>'}).join(''):'<p class="empty">Nothing logged yet.</p>','padding:6px 14px')+
  '<p class="hsec">Bills vs everyday</p>'+
  card(kv('Bills and fixed',m(billSpend)+' \u00B7 '+Math.round(billSpend/both*100)+'%')+meter(billSpend/both*100,'var(--dgreen)')+
   kv('Everyday',m(freeSpend)+' \u00B7 '+Math.round(freeSpend/both*100)+'%')+meter(freeSpend/both*100,'var(--brass)'),'padding:6px 14px 14px')}
/* goals + yearly */

     '<span class="mono" style="font-size:16px">'+m(b)+'</span></div>'+

     meter(pct,'var(--brass)')+
     '<p class="muted" style="margin-bottom:10px">'+m(Math.max(0,(e.target||0)-b))+' to go</p>'+
     '<div style="display:flex;gap:8px"><button data-g="'+e.id+'" data-v="2500" style="flex:1">Add $25</button>'+
     '<button data-g="'+e.id+'" data-v="10000" style="flex:1">Add $100</button>'+
     '<button data-ge="'+e.id+'" style="width:auto">\u270E</button></div>','padding:14px;margin-bottom:10px')}).join('')}

/* transition runway */
function monthsTo(ym){var a=ym.split('-'),n=new Date();
  return Math.max(0,(+a[0]-n.getFullYear())*12+(+a[1]-1-n.getMonth()))}
function monthlyExpenses(){var s=0;envs().forEach(function(e){s+=monthly(e)});return s}
function trBody(){
  var t=data.settings.tr,mo=monthsTo(t.date),exp=monthlyExpenses(),runway=exp*t.cushion;
  var fund=0,p=curP();(t.goalIds||[]).forEach(function(id){if(data.env[id])fund+=bal(id,p)});
  var gap=Math.max(0,exp-(t.income||0)),pers=Math.max(1,mo*2),need=Math.max(0,runway-fund)/pers;
  var pct=runway?fund/runway*100:0,gl=envs().filter(function(e){return e.kind==='goal'});
  return '<div style="background:var(--dgreen);color:#F3F1E8;border-radius:16px;padding:16px;margin-bottom:12px">'+
   '<p style="font-size:11px;letter-spacing:.1em;color:#A9BDB2">COUNTDOWN TO RETIREMENT</p>'+
   '<p class="serif" style="font-size:26px;margin-top:4px">'+(mo?mo+' month'+(mo>1?'s':''):'You made it')+'</p>'+
   '<p style="font-size:12px;color:#A9BDB2">'+(mo?'until '+t.date+' \u00B7 '+(mo*2)+' more paychecks':'Retirement date reached')+'</p></div>'+
  card('<div class="g2" style="margin-bottom:12px">'+
    '<div><p class="sec" style="margin:0 0 5px">Target date</p><input id="trd" type="month" value="'+t.date+'"></div>'+
    '<div><p class="sec" style="margin:0 0 5px">Cushion (months)</p><input id="trc" class="mono" inputmode="numeric" value="'+t.cushion+'"></div></div>'+
   '<p class="sec" style="margin:0 0 5px">Expected monthly income after retirement</p>'+
   '<input id="tri" class="mono" inputmode="decimal" value="'+(t.income?(t.income/100).toFixed(2):'')+'" placeholder="Pension, VA, part time">','padding:14px;margin-bottom:12px')+
  card('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
    '<p class="sec" style="margin:0">Runway fund lives in</p></div>'+
   '<p class="muted" style="margin-bottom:8px">Tap any number of goals. Their balances add together.</p>'+
   '<div id="trg" style="display:flex;flex-wrap:wrap;gap:6px">'+
    (gl.length?gl.map(function(e){var on=(t.goalIds||[]).indexOf(e.id)>=0;
      return '<button class="pill'+(on?' on':'')+'" data-tg="'+e.id+'">'+(on?'\u2713 ':'')+esc(e.name)+' <span style="opacity:.7">'+m0(bal(e.id,p))+'</span></button>'}).join('')
     :'<span class="muted">No goals yet. Make one on Budget.</span>')+'</div>','padding:14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 4px">Runway fund</p>'+
   '<p><span class="mono" style="font-size:26px;font-weight:500">'+m0(fund)+'</span>'+
   '<span class="muted"> of '+m0(runway)+' ('+t.cushion+' mo)</span></p>'+
   meter(pct,'var(--brass)')+
   '<p class="muted" style="margin-bottom:10px">'+Math.round(pct)+'% funded \u00B7 '+m0(Math.max(0,runway-fund))+' to go</p>'+
   kv('Your monthly expenses',m(exp))+
   kv('Save per paycheck to hit it in time',m(need),need>0?'var(--brasst)':'var(--green)')+
   kv('Monthly gap your income leaves',gap?m(gap):'Covered \u2713',gap?'var(--red)':'var(--green)'),'padding:14px;margin-bottom:12px')+
  card('<p class="serif" style="font-size:15px;margin-bottom:6px">What this is telling you</p><p class="muted">'+
   (gap?('Your expenses run '+m0(gap)+' a month past the income you expect. Over a '+t.cushion+' month cushion that is '+
     m0(gap*t.cushion)+' the runway fund has to absorb.')
    :'Your expected income covers the budget as it stands today. The runway fund is a buffer, not a lifeline.')+'</p>','padding:14px')}

function wireKids(){
  var add=$('#kadd');if(add)add.onclick=function(){kidEdit='new';render()};
  if(kidEdit!==null){
    function sum(){var t=(+$('#ks').value||0)+(+$('#kv').value||0)+(+$('#kg').value||0);
      $('#ksum').textContent='Adds up to '+t+'%'+(t===100?' \u2713':', it needs to make 100');
      $('#ksum').style.color=t===100?'var(--green)':'var(--brasst)'}
    ['#ks','#kv','#kg'].forEach(function(id){$(id).oninput=sum});sum();
    $('#kc').onclick=function(){kidEdit=null;render()};
    $('#ksv').onclick=function(){
      var n=$('#kn').value.trim();if(!n)return toast('Give the child a name first');
      var sp=+$('#ks').value||0,sv=+$('#kv').value||0,gv=+$('#kg').value||0;
      if(sp+sv+gv!==100)return toast('The split has to add up to 100');
      var ev=$('#ke').value||null,amt=toC($('#ka').value),freq=$('#kf').value;
      if(kidEdit==='new'){var id='k'+uid();
        put('kids/'+id,{n:n,amt:amt,freq:freq,sp:sp,sv:sv,gv:gv,env:ev,jars:{spend:0,save:0,give:0}});
        kidEdit=null;render();bar('Added '+esc(n),function(){delete data.kids[id]})}
      else{var prev=JSON.parse(JSON.stringify(data.kids[kidEdit])),kk=data.kids[kidEdit];
        put('kids/'+kidEdit,{n:n,amt:amt,freq:freq,sp:sp,sv:sv,gv:gv,env:ev,jars:kk.jars});
        var eid=kidEdit;kidEdit=null;render();bar('Saved '+esc(n),function(){data.kids[eid]=prev})}};
    return}
  document.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.k,k=data.kids[id],t=b.dataset.t;
    if(t==='edit'){kidEdit=id;return render()}
    if(t==='del'){if(!confirm('Delete '+k.n+'? Their jars go too.'))return;
      var prev=JSON.parse(JSON.stringify(k));put('kids/'+id,null);
      return bar('Deleted '+esc(prev.n),function(){data.kids[id]=prev})}
    if(t==='pay'){
      var a={spend:Math.round(k.amt*k.sp/100),save:Math.round(k.amt*k.sv/100),give:Math.round(k.amt*k.gv/100)};
      var jars={spend:k.jars.spend+a.spend,save:k.jars.save+a.save,give:k.jars.give+a.give};
      var txId=null;
      if(k.env&&data.env[k.env]){txId=uid();
        setPath(data,'tx/'+txId,{kind:'exp',amt:k.amt,env:k.env,payee:k.n+' allowance',date:today(),who:cfg.member||''})}
      put('kids/'+id+'/jars',jars);if(txId&&rootRef)rootRef.child('tx').set(data.tx);cache();
      return bar('Paid '+esc(k.n)+' '+m(k.amt),function(){
        setPath(data,'kids/'+id+'/jars',k.jars);if(txId)delete data.tx[txId]})}
    if(k.jars.spend<500)return toast(k.n+' has less than $5 in the spend jar');
    var j2={spend:k.jars.spend-500,save:k.jars.save,give:k.jars.give};
    put('kids/'+id+'/jars',j2);
    bar(esc(k.n)+' spent '+m(500),function(){setPath(data,'kids/'+id+'/jars',k.jars)})}})}

  card('<p class="sec" style="margin:0 0 6px">Paychecks</p>'+
    '<div class="kv"><span>Deposit on the 1st</span><input id="d1" class="mono" value="'+((data.settings.income1||0)/100).toFixed(2)+'" style="width:120px;text-align:right;padding:6px 8px"></div>'+
    '<div class="kv"><span>Deposit on the 15th</span><input id="d15" class="mono" value="'+((data.settings.income15||0)/100).toFixed(2)+'" style="width:120px;text-align:right;padding:6px 8px"></div>'+
    kv('Monthly total',m((data.settings.income1||0)+(data.settings.income15||0)))+
    '<p class="muted" style="margin-top:6px">Pay cycle is the 1st and the 15th.</p>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Recorded envelope amounts</p>'+
    '<p class="muted" style="margin-bottom:10px">Set every envelope to the amount you want for a pay period, then record it. From then on those are your targets and \u26A1 Fill drops those exact amounts in. Nothing is calculated for you.</p>'+
    '<button id="rec1" style="width:100%;margin-bottom:8px">\u{1F4CC} Record these envelope amounts for the 1st</button>'+
    '<button id="rec15" style="width:100%">\u{1F4CC} Record these envelope amounts for the 15th</button>'+
    '<p class="muted" style="margin-top:10px;line-height:1.6">'+tplSum('1st')+'<br>'+tplSum('15th')+'</p>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button id="clr1" style="flex:1">Clear the 1st record</button>'+
    '<button id="clr15" style="flex:1">Clear the 15th record</button></div>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Start over</p>'+
    '<p class="muted" style="margin-bottom:10px">Wipes the money back to zero so you can fill the envelopes again. Assignments, transactions and PAID marks all go.</p>'+
    '<div style="display:flex;gap:8px"><button id="cp" style="flex:1">Clear this pay period</button>'+
    '<button id="ca" style="flex:1" class="danger">Clear the money</button></div>'+
    '<button id="cb" style="width:100%;margin-top:8px" class="danger">\u{1F9E8} Delete every envelope and start from a blank list</button>','padding:13px 14px;margin-bottom:12px')+
  card('<p class="sec" style="margin:0 0 6px">Display</p>'+
    '<div class="kv"><span style="flex:1">In envelopes counts positive balances only</span>'+
    '<button id="po" class="chip" style="background:'+(data.settings.posOnly!==false?'var(--okbg)':'var(--mutbg)')+';color:'+(data.settings.posOnly!==false?'var(--green)':'#5F6B63')+'">'+
    (data.settings.posOnly!==false?'On':'Off')+'</button></div>','padding:13px 14px')}
function wireSet(){
  $('#hj').onclick=function(){var c=$('#hc').value.trim();if(!c)return toast('Type a code');
    cfg.code=c;if(!cfg.member){var id='u'+uid();data.members[id]={name:'Me'};cfg.member=id}
    saveCfg();cache();connect();toast('Joined household '+c);render()};
  $('#ma').onclick=function(){var n=$('#mn').value.trim();if(!n)return toast('Type a name');
    var id='u'+uid();put('members/'+id,{name:n});if(!cfg.member){cfg.member=id;saveCfg()}
    bar('Added '+esc(n),function(){delete data.members[id]})};
  document.querySelectorAll('[data-mu]').forEach(function(b){b.onclick=function(){
    cfg.member=b.dataset.mu;saveCfg();render();toast('This phone is now '+data.members[cfg.member].name)}});
  document.querySelectorAll('[data-md]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.md,prev=data.members[id];if(!confirm('Remove '+prev.name+'?'))return;
    put('members/'+id,null);bar('Removed '+esc(prev.name),function(){data.members[id]=prev})}});
  $('#d1').onchange=function(){put('settings/income1',toC(this.value))};
  $('#d15').onchange=function(){put('settings/income15',toC(this.value))};
  $('#po').onclick=function(){put('settings/posOnly',data.settings.posOnly===false)};
  function rec(which){
    var ps=monthPeriods(0),p=which==='1st'?ps[0]:ps[1],t={},n=0;
    envs().forEach(function(e){var v=alloc(e.id,p);if(v>0){t[e.id]=v;n++}});
    if(!n)return toast('Nothing assigned in that pay period yet. Fund your envelopes first.');
    var prev=which==='1st'?data.settings.tpl1:data.settings.tpl15;
    put('settings/'+(which==='1st'?'tpl1':'tpl15'),t);
    bar('Recorded '+n+' envelopes for the '+which,function(){setPath(data,'settings/'+(which==='1st'?'tpl1':'tpl15'),prev)})}
  $('#rec1').onclick=function(){rec('1st')};
  $('#rec15').onclick=function(){rec('15th')};
  $('#clr1').onclick=function(){var prev=data.settings.tpl1;put('settings/tpl1',null);
    bar('Cleared the 1st record',function(){setPath(data,'settings/tpl1',prev)})};
  $('#clr15').onclick=function(){var prev=data.settings.tpl15;put('settings/tpl15',null);
    bar('Cleared the 15th record',function(){setPath(data,'settings/tpl15',prev)})};
  $('#cp').onclick=function(){clearMoney('period')};
  $('#ca').onclick=function(){clearMoney('all')};
  $('#cb').onclick=function(){startBlank()}}
function clearMoney(scope){
  var p=curP(),mk=paidKey(p);
  var txAll=Object.keys(data.tx),txHere=txAll.filter(function(k){return pidOf(data.tx[k].date)===p});
  var paidAll=envs().filter(function(e){return e.paid&&Object.keys(e.paid).length});
  var paidHere=envs().filter(function(e){return e.paid&&e.paid[mk]});
  var nB=scope==='all'?Object.keys(data.budgets).length:Object.keys(data.budgets[p]||{}).length;
  var nT=scope==='all'?txAll.length:txHere.length;
  var nP=scope==='all'?paidAll.length:paidHere.length;
  if(!nB&&!nT&&!nP)return toast(scope==='all'?'Already empty':'Nothing logged in '+pName(p));
  if(!confirm('Wipe the envelopes back to zero?\n\nScope: '+(scope==='all'?'EVERY pay period':pName(p)+' only')+
    '\n\nRemoves '+nB+' assignments, '+nT+' transactions and '+nP+' PAID marks.\n\nKeeps your envelopes, members, recorded amounts, debts, accounts, kids and vault.\n\nThis cannot be undone.'))return;
  if(scope==='all'){setPath(data,'budgets',{});setPath(data,'tx',{});
    paidAll.forEach(function(e){data.env[e.id].paid=null})}
  else{setPath(data,'budgets/'+p,null);
    txHere.forEach(function(k){delete data.tx[k]});
    paidHere.forEach(function(e){delete data.env[e.id].paid[mk]})}
  cache();if(rootRef)rootRef.set(data);render();
  toast(scope==='all'?'Everything cleared. Fill the envelopes again from Budget.':'Cleared '+pName(p))}
function startBlank(){
  var n=envs().length;
  if(!confirm('Start completely from scratch?\n\nDeletes ALL '+n+' envelopes plus every assignment, transaction, PAID mark and recorded amount.\n\nKeeps members, debts, accounts, kids and the vault.\n\nThis cannot be undone.'))return;
  if(!confirm('Last check. Delete all '+n+' envelopes?'))return;
  setPath(data,'env',{});setPath(data,'budgets',{});setPath(data,'tx',{});
  setPath(data,'settings/tpl1',null);setPath(data,'settings/tpl15',null);
  cache();if(rootRef)rootRef.set(data);render();
  toast('Blank slate. Add your first envelope from Budget.')}
/* export */
function expBody(){
  return card('<p class="serif" style="font-size:16px;margin-bottom:6px">Backup</p>'+
   '<p class="muted" style="margin-bottom:12px">Everything: envelopes, transactions, recorded amounts, goals, kids, vault and settings. Do this before anything that rewrites stored data.</p>'+
   '<button id="ex" class="cta">Export JSON backup</button>'+
   '<p class="sec" style="margin-top:16px">Restore</p>'+
   '<textarea id="imp" rows="4" placeholder="Paste a backup here"></textarea>'+
   '<button id="im" style="width:100%;margin-top:8px" class="danger">Replace everything with this backup</button>','padding:16px')}
function wireExp(){
  $('#ex').onclick=function(){
    var s=JSON.stringify(data,null,2);
    try{var b=new Blob([s],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='home-base-'+today()+'.json';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);toast('Backup downloaded')}
    catch(e){prompt('Copy this and keep it somewhere safe',s)}};
  $('#im').onclick=function(){
    var v=$('#imp').value.trim();if(!v)return toast('Paste a backup first');
    var parsed;try{parsed=JSON.parse(v)}catch(e){return toast('That is not valid JSON')}
    if(!parsed.env)return toast('That backup has no envelopes in it');
    if(!confirm('Replace everything with this backup?'))return;
    data=Object.assign(blank(),parsed);cache();if(rootRef)rootRef.set(data);render();toast('Backup restored')}}
/* ========== nav / render ========== */
var tab='home',sub=null;
var TABS=[['home','\u{1F3E0}','Home'],['budget','\u2709\uFE0F','Budget'],['add','+',''],['cal','\u{1F4C5}','Calendar'],['more','\u2630','More']];
function go(t){tab=t;sub=null;if(t!=='more')moreOpen=null;kidEdit=null;vEdit=null;window.scrollTo(0,0);render()}
function paintNav(){
  var n=$('#nav');n.innerHTML='';
  TABS.forEach(function(t){
    var b=el('button',tab===t[0]?'on':'');
    b.innerHTML=t[0]==='add'?'<span class="fab">+</span>':'<span style="font-size:19px">'+t[1]+'</span><span>'+t[2]+'</span>';
    b.setAttribute('aria-label',t[2]||'Add expense');
    b.onclick=function(){t[0]==='add'?goAdd(null):go(t[0])};
    n.appendChild(b)})}
function render(){
  paintNav();
  if(sub==='fund')return screenFund();
  if(sub==='envform')return screenEnvForm();
  if(tab==='home')screenHome();
  else if(tab==='budget')screenBudget();
  else if(tab==='add')screenAdd();
  else if(tab==='cal')screenCal();
  else screenMore()}
function boot(){
  if(cfg.code)connect();
  if(!cfg.member){var ids=Object.keys(data.members);if(ids.length)cfg.member=ids[0];saveCfg()}
  render();
  if(!cfg.code)setTimeout(function(){toast('More \u2192 Settings to set your household code and deposits')},600)}
window.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
boot();
</script>
